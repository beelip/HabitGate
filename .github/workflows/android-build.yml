name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ランナー標準搭載の Android SDK を直接使う
      # （android-actions/setup-android は旧 'tools' パッケージを要求して新環境で壊れるため撤去）
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Normalize APK name
        run: |
          mkdir -p build-artifacts
          APK_PATH="$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" build-artifacts/habit-gate.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: habit-gate-apk
          path: build-artifacts/habit-gate.apk

      - name: Commit APK to repository
        run: |
          mkdir -p build
          cp build-artifacts/habit-gate.apk build/habit-gate.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/habit-gate.apk
          if git diff --cached --quiet; then
            echo "APK is unchanged, skipping commit."
          else
            git commit -m "ビルド済み APK を更新 [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(grep "versionName" app/build.gradle | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n 1)"
          test -n "$VERSION"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" build-artifacts/habit-gate.apk --clobber --repo "$GITHUB_REPOSITORY"
            echo "Updated existing release $TAG"
          else
            gh release create "$TAG" build-artifacts/habit-gate.apk \
              --repo "$GITHUB_REPOSITORY" \
              --title "HabitGate $TAG" \
              --notes "変更内容は [CHANGELOG.md](https://github.com/beelip/HabitGate/blob/main/CHANGELOG.md) を参照してください。"
          fi
